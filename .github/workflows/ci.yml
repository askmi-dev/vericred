name: VeriCred CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, audit and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            stitch-out/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix stitch-out ci
      - name: Audit backend and frontend dependency trees
        run: |
          npm audit --audit-level=high
          npm --prefix stitch-out audit --audit-level=high
      - name: Build static pages and backend before integration tests
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Run isolated regression tests
        run: npm test

  container:
    name: Docker build, persistence and restoration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: vericred:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify startup, persistence, writer exclusion and separate-volume restoration
        run: node scripts/docker-smoke.mjs vericred:ci

  live-connectors:
    name: Live PostgreSQL and MySQL acceptance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exercise real drivers and isolated database containers
        run: npm run test:connectors:live
